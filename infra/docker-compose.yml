name: liveface

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: liveface
      POSTGRES_PASSWORD: liveface
      POSTGRES_DB: liveface
    ports:
      - "7003:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liveface"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: liveface
      MINIO_ROOT_PASSWORD: liveface-secret
    ports:
      - "7004:9000"   # S3 API
      - "7005:9001"   # Console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot bucket bootstrap.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 liveface liveface-secret &&
      mc mb --ignore-existing local/liveface &&
      echo 'bucket ready'"

volumes:
  pgdata:
  miniodata:

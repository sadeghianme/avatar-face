# Every regression this pipeline exists to catch was first caught by hand:
# a quality_note UnboundLocalError that broke 3D avatars, a Latin-only word
# regex that silenced every non-Latin language, and a gradient inversion that
# turned head motion into a no-op. Tests existed for all three; nothing ran
# them automatically.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch (or pull request) supersedes the run in
# progress: its result would describe a commit nobody will deploy, and
# deploy/deploy.sh only ships a commit whose OWN run passed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The required checks on main (docs/process.md, "Branch protection") are the
# job ids backend, embed, frontend, frontend-lint, deploy-script and images:
# rename one only together with that rule. backend-checks and backend-tests
# are not required themselves: `backend` passes only when they all do.
jobs:
  # The backend is three jobs side by side: its static checks, and its test
  # suite in two halves. Each restores the same virtualenv.
  backend-checks:
    # Everything but the tests: lint, formatting, types, the API document,
    # and the migrations against the models. No system libraries: nothing
    # here loads mediapipe or espeak (tests/test_layering.py keeps them lazy).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.12"
      - name: Restore the virtualenv
        # The whole environment, keyed on everything that decides it: the
        # Python, the production pins and the project's own requirements. A
        # hit skips the install; a miss installs, and the job saves it.
        id: venv
        uses: actions/cache@v6
        with:
          path: backend/.venv
          key: venv-${{ runner.os }}-python${{ steps.python.outputs.python-version }}-${{ hashFiles('backend/constraints.txt', 'backend/pyproject.toml') }}
      - name: Install backend
        # With the production pins (constraints.txt, as the Dockerfile
        # installs): the tests and the type check see the library versions
        # that run in production, and a new release upstream cannot turn
        # this job red on its own.
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -c constraints.txt -e ".[rig,dev]"
      - name: Use the virtualenv
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: ruff check .
      - name: Formatting
        # ruff's formatter, configured in pyproject.toml ([tool.ruff.format]).
        # To fix: `ruff format .` from backend/.
        run: ruff format --check .
      - name: Type check
        run: pyright
      - name: OpenAPI document matches the code
        # frontend/src/lib/api-schema.json is the contract the dashboard and
        # the widget generate their types from, and scripts/export_openapi.py
        # its one generator. Exported again here and compared: an API change
        # committed without its document fails (frontend-lint and embed then
        # hold their generated types to the document).
        run: |
          python scripts/export_openapi.py ../frontend/src/lib/api-schema.json
          git diff --exit-code -- ../frontend/src/lib/api-schema.json
      - name: Migrations match the models
        # A fresh SQLite built by the migrations alone, compared with the
        # models (`alembic check`: tables, columns, types, nullability,
        # indexes, foreign keys); then the newest migration down, up again,
        # and compared once more. Production runs the migrations when the API
        # starts, while the tests build their schema from the models: a model
        # change without its migration, or a downgrade that leaves something
        # behind, fails here and nowhere else.
        env:
          DATABASE_URL: sqlite+aiosqlite:///${{ runner.temp }}/migrations.sqlite3
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade -1
          alembic upgrade head
          alembic check

  backend-tests:
    # The suite in two halves side by side (LIVEFACE_TEST_SHARD, read by
    # tests/conftest.py: each test belongs to exactly one), each half on
    # every core of its runner (pytest-xdist, -n auto).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One half failing must not cancel the other: both sets of failures.
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: backend
    env:
      # The two MediaPipe models, as backend/Dockerfile pins them. No test
      # loads them yet: the one that would (the reference manifest rebuilt
      # from the masters, test_performance_kit.py) is opt-in through
      # LIVEFACE_FACE_MODEL, and compares bytes with the committed manifest,
      # which the one rebuilt on this runner does not match.
      FACE_MODEL_URL: https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task
      FACE_MODEL_SHA256: 64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff
      SEGMENT_MODEL_URL: https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/1/selfie_segmenter.tflite
      SEGMENT_MODEL_SHA256: 191ac9529ae506ee0beefa6b2c945a172dab9d07d1e802a290a4e4038226658b
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.12"
      - name: Restore the virtualenv
        # As in backend-checks: the same key, so the same environment.
        id: venv
        uses: actions/cache@v6
        with:
          path: backend/.venv
          key: venv-${{ runner.os }}-python${{ steps.python.outputs.python-version }}-${{ hashFiles('backend/constraints.txt', 'backend/pyproject.toml') }}
      - name: Install backend
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -c constraints.txt -e ".[rig,dev]"
      - name: Use the virtualenv
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install system libraries (as the Dockerfile does)
        # espeak-ng for multilingual phonemes; libegl1/libgles2 because
        # mediapipe 1.x loads a C library needing them at its first task, and
        # without them face detection silently falls back (backend/Dockerfile).
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          espeak-ng libgl1 libglib2.0-0 libegl1 libgles2
      - name: Restore the MediaPipe models
        # Keyed on their checksums: a new model is a new key.
        id: models
        uses: actions/cache@v6
        with:
          path: backend/models
          key: mediapipe-${{ env.FACE_MODEL_SHA256 }}-${{ env.SEGMENT_MODEL_SHA256 }}
      - name: Fetch the MediaPipe models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -fsSL --retry 5 --retry-all-errors -o models/face_landmarker.task "$FACE_MODEL_URL"
          curl -fsSL --retry 5 --retry-all-errors -o models/selfie_segmenter.tflite "$SEGMENT_MODEL_URL"
      - name: Check the MediaPipe models
        # Fetched or restored, the bytes the Dockerfile pins.
        run: |
          printf '%s  %s\n' \
            "$FACE_MODEL_SHA256" models/face_landmarker.task \
            "$SEGMENT_MODEL_SHA256" models/selfie_segmenter.tflite | sha256sum -c -
      - name: Stub widget bundles
        # The bundle-serving tests assert caching/CORS headers, which only
        # exist when the file does; any content works, so stubs beat pulling
        # the whole Node toolchain into this job. The standard teeth are
        # committed files the build only copies, and their test checks the
        # bytes served, so they are copied as the build does.
        run: |
          mkdir -p ../embed/dist
          echo "// ci stub" > ../embed/dist/liveface.js
          echo "// ci stub" > ../embed/dist/liveface-3d.js
          echo "// ci stub" > ../embed/dist/basis_transcoder.js
          printf '\0asm\1\0\0\0' > ../embed/dist/basis_transcoder.wasm
          cp ../embed/assets/mouth-teeth.webp ../embed/assets/mouth-teeth.rig.json ../embed/dist/
      - name: Tests (half ${{ matrix.shard }} of 2)
        env:
          LIVEFACE_TEST_SHARD: ${{ matrix.shard }}/2
        run: python -m pytest tests -q -n auto

  backend:
    # The required check (branch protection names it): green only when
    # backend-checks and both halves of backend-tests are. `always()`: a
    # required check that is skipped counts as passed, so this one never
    # skips; it runs whatever happened before it and fails unless all passed.
    if: always()
    needs: [backend-checks, backend-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every backend job passed
        env:
          CHECKS: ${{ needs.backend-checks.result }}
          TESTS: ${{ needs.backend-tests.result }}
        run: |
          echo "backend-checks: $CHECKS, backend-tests: $TESTS"
          test "$CHECKS" = success && test "$TESTS" = success

  embed:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: embed
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: embed/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      # Prettier, with the dashboard's settings (.prettierrc.json).
      - name: Formatting
        run: npm run format:check
      # The build's sources, then the tests and the bake script the build
      # leaves out (tsconfig.test.json): a test that no longer type-checks
      # against the code it tests fails here, not by passing on stale casts.
      - name: Typecheck (sources, tests)
        run: npm run typecheck
      # src/api-types.ts (what the widget reads from the API) is generated
      # from the committed OpenAPI document by scripts/gen-api-types.mjs: a
      # hand edit, or a document committed without regenerating, fails here.
      - name: API types match the committed schema
        run: npm run check:api
      # Tests before build: the engine's motion and cue logic had no
      # automated coverage at all, and every regression in it this far has
      # been invisible in a screenshot. The golden render snapshots are
      # compared, never rewritten: vitest run fails on a mismatch.
      # pixels.test.ts draws real frames on Skia's CPU raster
      # (@napi-rs/canvas, a prebuilt binary npm ci installs: no browser) and
      # holds them to committed goldens; a frame that fails is uploaded.
      - run: npm test
      - name: Upload the frames that failed the pixel goldens
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: pixel-diffs
          path: embed/dist/pixel-diffs/
          if-no-files-found: ignore
      - run: npm run build
      # The speech cache's encoder (backend/app/services/tts/speech_codec.py),
      # run by the speech timing test below on its own: soundfile and numpy at
      # the production pins, nothing else of the backend.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the speech encoder
        run: pip install -c ../backend/constraints.txt soundfile numpy
      # The browser tests (browser-tests/), in Chromium with WebGL on
      # SwiftShader: the GPU warp most visitors get, against the 2D path and
      # its goldens, and liveface.js with its names renamed against the same
      # bundle without, pixel for pixel. The speech timing test also runs in
      # Firefox and WebKit: a cached line played as the widget plays it, its
      # sound found again where the engine's clock says it is. The browsers
      # are cached by Playwright's version (package-lock.json pins it); their
      # system libraries are not in the cache, so they are installed either
      # way.
      - name: Playwright's version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache the browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: browsers-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install the browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium firefox webkit
      - name: Install the browsers' system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit
      # The runner has no sound card: without a sound server Firefox's audio
      # never starts and WebKit's runs on no device's clock. A null sink plays
      # in real time to nowhere.
      - name: A sound server with a null sink
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=nowhere
          pactl set-default-sink nowhere
      - name: Browser tests
        env:
          LIVEFACE_PYTHON: python
          SPEECH_TIMING_BROWSERS: chromium,firefox,webkit
          SPEECH_TIMING_DUMP_DIR: dist/speech-timing
        run: npm run test:browser
      - name: Upload what the speech timing pages recorded
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: speech-timing
          path: embed/dist/speech-timing/
          if-no-files-found: ignore
      - name: Upload the frames that failed the browser goldens
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-diffs
          path: embed/dist/browser-diffs/
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The dashboard imports @liveface/embed straight from ../embed/src via
      # tsconfig paths, so its node_modules must exist for the type-check.
      - name: Install embed deps
        run: npm ci --prefix ../embed
      - run: npm ci
      # The app, then the tests' own program (tsconfig.test.json): a test
      # that no longer type-checks against the code it tests fails here.
      - name: Typecheck (app, tests)
        run: npm run typecheck
      - name: Typecheck and build
        run: npm run build

  frontend-lint:
    # The dashboard's lint (the UI kit and data-layer rules among them,
    # docs/frontend-ui.md), its formatting and its unit tests. Node 22:
    # node --test runs the .test.ts files by stripping their types.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The type-aware rules resolve @liveface/embed from ../embed/src.
      - name: Install embed deps
        run: npm ci --prefix ../embed
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # lib/api-types.ts is generated from the committed OpenAPI schema
      # (lib/api-schema.json, refreshed with `npm run api:schema`): a hand
      # edit, or a schema committed without regenerating, fails here.
      - name: API types match the committed schema
        run: npm run check:api
      - run: npm test
      # The kit and the main screens mounted in jsdom (Vitest + Testing
      # Library), against a mocked API: src/test/.
      - name: Rendering tests
        run: npm run test:ui

  deploy-script:
    # The release gate itself: shellcheck on every deploy script, then
    # deploy.sh's refusals (dirty tree, unpushed commit, CI not green) and
    # its acceptance of a green pushed commit, in a scratch repository with
    # a stub gh (deploy/test-deploy.sh). Nothing here contacts a server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck (pinned)
        run: >
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt
          koalaman/shellcheck:v0.10.0@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb
          deploy/*.sh
      - name: deploy.sh gates
        run: deploy/test-deploy.sh

  images:
    # The two production images, built from this commit exactly as the server
    # builds them: every model download checked against its SHA-256, the
    # dashboard's nginx config validated (nginx -t runs in the build). Then
    # they are started behind a Caddy stand-in and must report this commit on
    # /api/health and /version.json, and every page must load in headless
    # Chrome with zero Content-Security-Policy violations, the Simulator's
    # widget and the share page's speech included (deploy/smoke/).
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build the API image
        run: docker build -f backend/Dockerfile --build-arg LIVEFACE_VERSION=${{ github.sha }} -t liveface-api:ci .
      - name: Build the dashboard image
        run: docker build -f frontend/Dockerfile --build-arg LIVEFACE_VERSION=${{ github.sha }} -t liveface-web:ci .
      - name: Start both behind a Caddy stand-in
        run: |
          docker run -d --name api -p 127.0.0.1:7092:7002 --tmpfs /data \
            -e JWT_SECRET=ci-only-not-a-secret \
            -e PUBLIC_BASE_URL=http://127.0.0.1:7090/api \
            -e APP_BASE_URL=http://127.0.0.1:7090 \
            -e CORS_ORIGINS=http://127.0.0.1:7090 \
            -e DATABASE_URL=sqlite+aiosqlite:////data/liveface.sqlite3 \
            -e LOCAL_STORAGE_DIR=/data/storage \
            -e ENVIRONMENT=production \
            liveface-api:ci
          docker run -d --name web -p 127.0.0.1:7091:80 liveface-web:ci
          nohup node deploy/smoke/proxy.mjs 7090 http://127.0.0.1:7091 http://127.0.0.1:7092 > proxy.log 2>&1 &
          for attempt in $(seq 1 90); do
            curl -sf http://127.0.0.1:7090/api/health && break
            [ "$attempt" -lt 90 ] || { docker logs api; exit 1; }
            sleep 2
          done
      - name: Both images report this commit
        run: |
          curl -sf http://127.0.0.1:7090/api/health | grep -F '"version":"${{ github.sha }}"'
          curl -sf http://127.0.0.1:7090/version.json | grep -F '"version":"${{ github.sha }}"'
      - name: Every page, zero CSP violations
        run: node deploy/smoke/web-sweep.mjs http://127.0.0.1:7090
      - name: Container logs
        if: failure()
        run: |
          docker logs api 2>&1 | tail -100
          docker logs web 2>&1 | tail -50
          cat proxy.log

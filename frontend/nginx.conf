# The dashboard SPA. Production puts Cloudflare and then Caddy in front:
# Caddy terminates TLS and sends /api/* to the API container, everything
# else here. Security headers: nginx-security-headers.conf (copied to
# /etc/nginx/snippets/security-headers.conf by the Dockerfile).

# Who may frame a page. The share page (/s/<token>) is the one page made to
# be opened from, and embedded in, other sites; the dashboard is never
# framed. Keyed on $request_uri, not $uri: try_files falls back to
# /index.html by an internal redirect that rewrites $uri, so every SPA route
# would look like "/index.html" by the time the headers are added.
map $request_uri $frame_ancestors {
    default  "'none'";
    ~^/s/    "*";
}
map $request_uri $x_frame_options {
    default  "DENY";
    ~^/s/    "";
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed assets can cache forever; the shell must not.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

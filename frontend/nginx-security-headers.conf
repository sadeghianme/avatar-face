# Security headers for every dashboard response. Included in EACH location
# of nginx.conf: an add_header inside a location drops every add_header
# inherited from the server block, so headers set once at the top would
# silently vanish from any location that adds its own Cache-Control.
#
# Content-Security-Policy, by directive:
#   script-src   'self'; 'unsafe-inline' only for the Simulator, whose
#                "customer page" is an <iframe srcdoc> with inline scripts
#                written per run: a srcdoc document inherits this policy, so
#                no hash or nonce can cover it (follow-up in docs/process.md,
#                "Security headers"). 'wasm-unsafe-eval' for three.js's
#                meshopt decoder and the Basis transcoder, which compile
#                WebAssembly; it does not allow eval().
#   connect-src  'self' is the API (/api, behind the same host) and its
#                signed storage URLs. blob:/data: are three.js's GLTF loader
#                fetching the textures inside a .glb. The jsDelivr PATH is
#                the KTX2 transcoder embed/src/engine3d.ts loads: pinned to
#                that three.js version, never the whole CDN (any npm package
#                is on it). Move it with three's version.
#   img-src      uploads previewed from blob: URLs, data: thumbnails.
#   media-src    speech arrives as data: URIs; recordings play from blob:.
#   worker-src   the transcoder runs in a worker made from a blob: URL.
#   frame-src    the Simulator's srcdoc frame ('self') and Avaturn's editor.
#   frame-ancestors  nothing may frame the dashboard; the share page
#                (/s/<token>) may be framed anywhere ($frame_ancestors,
#                nginx.conf). The widget is not served here at all: it is
#                /api/liveface.js on customers' pages, under THEIR policy.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self' blob: data: https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/libs/basis/; worker-src 'self' blob:; frame-src 'self' https://*.avaturn.me https://*.avaturn.dev; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors $frame_ancestors" always;
# The same rule for browsers that predate frame-ancestors (empty on /s/,
# which sends no header at all).
add_header X-Frame-Options $x_frame_options always;
add_header X-Content-Type-Options "nosniff" always;
# Reset, invite and share links carry their token in the path or query:
# another origin is told only which site the visitor came from.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# The microphone records voices (lib/recorder.ts) and feeds listen(); the
# camera only ever runs inside Avaturn's editor frame. Nothing else is used.
add_header Permissions-Policy "accelerometer=(), camera=(self \"https://*.avaturn.me\" \"https://*.avaturn.dev\"), geolocation=(), gyroscope=(), magnetometer=(), microphone=(self \"https://*.avaturn.me\" \"https://*.avaturn.dev\"), payment=(), usb=()" always;
# TLS ends at Cloudflare and Caddy, not here, but neither sends HSTS
# (checked on the live responses, 2026-10-06), and every public request
# reaches this server over HTTPS. Browsers ignore the header on plain HTTP,
# so local runs are unaffected. If Caddy or Cloudflare starts sending it,
# drop this line rather than send it twice.
add_header Strict-Transport-Security "max-age=31536000" always;

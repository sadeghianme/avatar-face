[project]
name = "liveface-backend"
version = "0.1.0"
description = "Liveface API — real-time talking-avatar SaaS backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "passlib>=1.7.4",
    "bcrypt==4.0.1",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "aioboto3>=13.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.13",
    "Pillow>=10.3",
    "cryptography>=42.0",
    # Local TTS (Kokoro-82M via ONNX). Model weights are downloaded by the
    # Dockerfile, not pip; without them the provider reports unconfigured.
    "kokoro-onnx>=0.4",
    "piper-tts>=1.3",
    "soundfile>=0.12",
]

[project.optional-dependencies]
rig = ["mediapipe>=0.10.14"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

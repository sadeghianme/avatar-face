[project]
name = "liveface-backend"
version = "0.1.0"
description = "Liveface API — real-time talking-avatar SaaS backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "passlib>=1.7.4",
    "bcrypt==4.0.1",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "aioboto3>=13.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.13",
    "Pillow>=10.3",
    "cryptography>=42.0",
    # Local TTS (Kokoro-82M via ONNX). Model weights are downloaded by the
    # Dockerfile, not pip; without them the provider reports unconfigured.
    "kokoro-onnx==0.6.1",
    "piper-tts>=1.3",
    "soundfile>=0.12",
]

[project.optional-dependencies]
rig = ["mediapipe>=0.10.14"]
# In-process voice-clone rendering. Install ONLY where an accelerator lives
# (an operator's Apple Silicon laptop or a CUDA box) — the server image must
# not carry 2.5GB of torch for a capability it refuses on CPU anyway.
clone = ["chatterbox-tts>=0.1", "resemble-perth>=1.0", "setuptools<81"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    # `pytest -n auto`: the suite on every core (CI runs it so).
    "pytest-xdist>=3.6",
    # Both pinned: a new release of either can add diagnostics, and CI should
    # not turn red on an upgrade nobody made. Bump them deliberately.
    "ruff==0.15.16",
    "pyright==1.1.414",
    # Coverage (`pytest --cov`, configured in .coveragerc). Pinned for the
    # same reason: a new release can count a line or a branch differently,
    # and the floor is a measured number.
    "pytest-cov==7.1.0",
    "coverage==7.16.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Coverage (`pytest --cov`) is configured in .coveragerc, not here: CI's
# virtualenv cache is keyed on this file, and raising the floor must not
# cost a reinstall.

[tool.ruff]
line-length = 100
target-version = "py312"
# Migrations are history: never rewritten, so never linted into a rewrite
# (nor formatted).
extend-exclude = ["alembic/versions"]

# `ruff format` (CI runs `ruff format --check .`): Black's style at the line
# length above. Double quotes, which the code already used almost everywhere.
# A trailing comma after the last item keeps a call or a literal one item per
# line. The hand-laid data tables (landmark index lists, sound-to-viseme maps,
# the blendshape matrices) keep their rows between `# fmt: off` / `# fmt: on`;
# anything else is the formatter's.
[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
# Ruff's defaults (E4, E7, E9, F), and: bugbear, simplify, pyupgrade, isort,
# flake8-return, pathlib, comprehensions.
extend-select = ["B", "SIM", "UP", "I", "RET", "PTH", "C4"]
ignore = [
    # zip() without strict=: every zip here pairs sequences of one length by
    # construction; strict=True would add a check per call, not catch a bug.
    "B905",
    # "AA AE AH ...".split(): the phoneme tables read as tables.
    "SIM905",
    # (str, Enum) -> StrEnum changes str() of every member, which rows,
    # logs and error texts show.
    "UP042",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
# The package, not the backend/alembic directory beside it.
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's parameter declarations, not mutable defaults.
extend-immutable-calls = [
    "fastapi.Body", "fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Header",
    "fastapi.Path", "fastapi.Query",
]

[tool.ruff.lint.per-file-ignores]
# Fixtures imported from another test module are named as test parameters,
# which pyflakes reads as redefining the import.
"tests/**" = ["F811"]

# `pyright` from backend/ (CI runs it). Standard mode, the application only;
# the tests and scripts are not type-checked.
[tool.pyright]
include = ["app"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Production deployment behind the shared Caddy reverse proxy.
# deploy/deploy.sh runs it (docs/process.md): it ships one commit, then on
# the server, from deploy/:
#   LIVEFACE_VERSION=<commit> docker compose -f docker-compose.prod.yml up -d --build
# Built by hand without LIVEFACE_VERSION, the images say "dev" on /health
# and /version.json, and deploy.sh --rollback cannot tell what they are.
# Requires an external `web_proxy` network (the Caddy ingress network) and a
# `.env` file next to this compose file providing JWT_SECRET.

name: liveface

services:
  liveface-api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        # The timestamped Kokoro model: production speech is timed by it
        # (services.tts.kokoro). The Dockerfile's default, stated here so a
        # change of default cannot silently drop native timing.
        INCLUDE_LIPSYNC_MODEL: "1"
        # The release's commit: /health reports it, deploy.sh checks it.
        LIVEFACE_VERSION: ${LIVEFACE_VERSION:-dev}
    restart: unless-stopped
    environment:
      PUBLIC_BASE_URL: https://avatar.mehdisadeghian.com/api
      DATABASE_URL: sqlite+aiosqlite:////data/liveface.sqlite3
      LOCAL_STORAGE_DIR: /data/storage
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      # Password reset email. Without these the endpoint still answers
      # normally — it must not reveal whether an address exists — but nothing
      # is delivered, so the API logs an error at ERROR level instead.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Avatar image generation. Absent means the endpoint reports itself
      # unavailable rather than half-working.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Reset links point at the dashboard, not the API.
      APP_BASE_URL: https://avatar.mehdisadeghian.com
      CORS_ORIGINS: https://avatar.mehdisadeghian.com
      ENVIRONMENT: production
      # The client's address, which every per-client rate limit and the
      # consent record's keyed address hash use (backend/app/core/client_ip.py).
      # Requests arrive Cloudflare -> Caddy -> here. The API is reached only
      # through Caddy on the web_proxy network (no published port), so the
      # peer is Caddy's container, in one of the private ranges docker
      # assigns: from there, the X-Forwarded-For entry Caddy wrote, the
      # rightmost, is believed, and nothing a client put to its left (one
      # hop). That entry is a Cloudflare edge, from Cloudflare's
      # published ranges (backend/app/core/cloudflare_ranges.py), so the
      # visitor is taken from CF-Connecting-IP. A request that reaches Caddy
      # without Cloudflare is keyed on its own address, whatever headers it
      # sends. Uvicorn's own proxy-header handling is off (backend/Dockerfile).
      TRUSTED_PROXIES: "172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"
      TRUSTED_PROXY_HOPS: "1"
      TRUST_CLOUDFLARE: "true"
    volumes:
      - liveface_data:/data
    networks:
      - web_proxy

  liveface-web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        # Served at /version.json; deploy.sh checks it.
        LIVEFACE_VERSION: ${LIVEFACE_VERSION:-dev}
    restart: unless-stopped
    networks:
      - web_proxy

volumes:
  liveface_data:

networks:
  web_proxy:
    external: true
